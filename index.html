<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Iniciar sesión</title>
  <meta name="description" content="Domus, administración inteligente del hogar." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script type="module" src="js/register-sw.js"></script>
</head>
<body>
  <div class="domus-auth-shell">
    <div class="card domus-auth-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="domus-logo h2 mb-1">Domus</h1>
          <p class="text-muted mb-0">Administración inteligente del hogar</p>
        </div>

        <div id="mensaje"></div>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required autocomplete="email" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required autocomplete="current-password" minlength="6" />
          </div>
          <div class="d-flex justify-content-end mb-3">
            <a href="recuperar/" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" id="btn-login" class="btn btn-domus-primary w-100">Iniciar sesión</button>
        </form>

        <hr class="my-4" />
        <p class="text-center mb-0">
          ¿No tienes cuenta? <a href="registro/" class="text-decoration-none">Regístrate</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="domus-footer-credit">Sebas Dev © 2026</footer>

  <script type="module">
    import { iniciarSesion, obtenerSesion } from './js/auth.js';
    import { mostrarMensaje, limpiarMensaje, traducirErrorAuth, alternarCargando } from './js/ui.js';

    // Si ya hay sesión activa, saltar directo a la app
    obtenerSesion().then((sesion) => {
      if (sesion) window.location.href = 'hogares/';
    });

    document.getElementById('form-login').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      alternarCargando('btn-login', true);
      try {
        await iniciarSesion(email, password);
        window.location.href = 'hogares/';
      } catch (error) {
        mostrarMensaje('mensaje', traducirErrorAuth(error));
        alternarCargando('btn-login', false, 'Iniciar sesión');
      }
    });
  </script>
</body>
</html>
