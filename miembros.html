<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Miembros del hogar</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f5d50" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script type="module" src="js/register-sw.js"></script>
</head>
<body>
  <nav class="navbar navbar-domus navbar-expand">
    <div class="container">
      <a class="navbar-brand mb-0 h1" href="dashboard.html">Domus</a>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">← Volver al panel</a>
    </div>
  </nav>

  <div class="container py-4 py-md-5" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Miembros de <span id="nombre-hogar">este hogar</span></h2>
      <button id="btn-mostrar-invitar" class="btn btn-domus-primary btn-sm" style="display:none;">
        + Invitar
      </button>
    </div>

    <div id="mensaje"></div>

    <div id="form-invitar-wrap" class="card mb-4" style="display:none;">
      <div class="card-body">
        <h6 class="card-title">Invitar por correo</h6>
        <form id="form-invitar" class="row g-2 align-items-end">
          <div class="col-12 col-sm-6">
            <label class="form-label small">Correo</label>
            <input type="email" id="email-invitar" class="form-control" required />
          </div>
          <div class="col-8 col-sm-4">
            <label class="form-label small">Rol</label>
            <select id="rol-invitar" class="form-select">
              <option value="miembro" selected>Miembro</option>
              <option value="administrador">Administrador</option>
              <option value="invitado">Invitado</option>
            </select>
          </div>
          <div class="col-4 col-sm-2">
            <button type="submit" id="btn-invitar" class="btn btn-domus-primary w-100">Invitar</button>
          </div>
        </form>
      </div>
    </div>

    <ul id="lista-miembros" class="list-group">
      <li class="list-group-item text-muted">Cargando...</li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { protegerPagina, obtenerUsuarioActual } from './js/auth.js';
    import {
      obtenerHogarActivoValidado,
      listarMiembros,
      invitarMiembro,
      eliminarMiembro,
    } from './js/hogares.js';
    import { mostrarMensaje, limpiarMensaje, alternarCargando } from './js/ui.js';

    const sesion = await protegerPagina();
    let hogarActivo = null;
    let usuarioActualId = null;

    if (sesion) {
      const usuario = await obtenerUsuarioActual();
      usuarioActualId = usuario.id;
      hogarActivo = await obtenerHogarActivoValidado();
      if (!hogarActivo) {
        window.location.href = 'hogares.html';
      } else {
        document.getElementById('nombre-hogar').textContent = hogarActivo.nombre;
        if (hogarActivo.mi_rol === 'administrador') {
          document.getElementById('btn-mostrar-invitar').style.display = 'inline-block';
        }
        await cargarMiembros();
      }
    }

    document.getElementById('btn-mostrar-invitar').addEventListener('click', () => {
      const wrap = document.getElementById('form-invitar-wrap');
      wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
    });

    async function cargarMiembros() {
      const lista = document.getElementById('lista-miembros');
      try {
        const miembros = await listarMiembros(hogarActivo.id);
        lista.innerHTML = miembros
          .map((m) => {
            const puedeQuitar =
              hogarActivo.mi_rol === 'administrador' || m.perfil.id === usuarioActualId;
            return `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <div>${escapeHtml(m.perfil.nombre_completo || m.perfil.email)}</div>
                  <small class="text-muted">${escapeHtml(m.perfil.email)}</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <span class="badge text-bg-light border">${m.rol}</span>
                  ${
                    puedeQuitar
                      ? `<button class="btn btn-sm btn-outline-danger" data-quitar="${m.perfil.id}">
                          ${m.perfil.id === usuarioActualId ? 'Salir' : 'Quitar'}
                        </button>`
                      : ''
                  }
                </div>
              </li>`;
          })
          .join('');

        lista.querySelectorAll('[data-quitar]').forEach((boton) => {
          boton.addEventListener('click', async () => {
            if (!confirm('¿Seguro que quieres continuar?')) return;
            try {
              await eliminarMiembro(hogarActivo.id, boton.dataset.quitar);
              if (boton.dataset.quitar === usuarioActualId) {
                window.location.href = 'hogares.html';
              } else {
                await cargarMiembros();
              }
            } catch (error) {
              mostrarMensaje('mensaje', 'No se pudo completar la acción: ' + error.message);
            }
          });
        });
      } catch (error) {
        mostrarMensaje('mensaje', 'No se pudieron cargar los miembros: ' + error.message);
      }
    }

    document.getElementById('form-invitar').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const email = document.getElementById('email-invitar').value.trim();
      const rol = document.getElementById('rol-invitar').value;

      alternarCargando('btn-invitar', true);
      try {
        const resultado = await invitarMiembro(hogarActivo.id, email, rol);
        const texto =
          resultado === 'agregado_directamente'
            ? `${email} fue agregado al hogar.`
            : `${email} aún no tiene cuenta en Domus: quedará agregado automáticamente en cuanto se registre.`;
        mostrarMensaje('mensaje', texto, 'success');
        document.getElementById('form-invitar').reset();
        await cargarMiembros();
      } catch (error) {
        mostrarMensaje('mensaje', 'No se pudo invitar: ' + error.message);
      } finally {
        alternarCargando('btn-invitar', false, 'Invitar');
      }
    });

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }
  </script>
</body>
</html>
