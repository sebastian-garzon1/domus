<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Recuperar contraseña</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Domus" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" />
  <script type="module" src="../js/register-sw.js"></script>
</head>
<body>
  <div class="domus-auth-shell">
    <div class="card domus-auth-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="domus-logo h2 mb-1">Domus</h1>
          <p class="text-muted mb-0">Recuperar contraseña</p>
        </div>

        <div id="mensaje"></div>

        <form id="form-recuperar" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required autocomplete="email" />
          </div>
          <button type="submit" id="btn-recuperar" class="btn btn-domus-primary w-100">
            Enviar enlace de recuperación
          </button>
        </form>

        <hr class="my-4" />
        <p class="text-center mb-0">
          <a href="../" class="text-decoration-none">Volver a iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="domus-footer-credit">Sebas Dev © 2026</footer>

  <script type="module">
    import { solicitarRecuperacion } from '../js/auth.js';
    import { mostrarMensaje, limpiarMensaje, traducirErrorAuth, alternarCargando } from '../js/ui.js';

    document.getElementById('form-recuperar').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const email = document.getElementById('email').value.trim();

      alternarCargando('btn-recuperar', true);
      try {
        await solicitarRecuperacion(email);
        mostrarMensaje(
          'mensaje',
          'Si el correo existe, te enviamos un enlace para restablecer tu contraseña.',
          'success'
        );
      } catch (error) {
        mostrarMensaje('mensaje', traducirErrorAuth(error));
      } finally {
        alternarCargando('btn-recuperar', false, 'Enviar enlace de recuperación');
      }
    });
  </script>
</body>
</html>
