<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Crear cuenta</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script type="module" src="js/register-sw.js"></script>
</head>
<body>
  <div class="domus-auth-shell">
    <div class="card domus-auth-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="domus-logo h2 mb-1">Domus</h1>
          <p class="text-muted mb-0">Crea tu cuenta</p>
        </div>

        <div id="mensaje"></div>

        <form id="form-registro" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required autocomplete="email" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required autocomplete="new-password" minlength="6" />
            <div class="form-text">Mínimo 6 caracteres.</div>
          </div>
          <button type="submit" id="btn-registro" class="btn btn-domus-primary w-100">Crear cuenta</button>
        </form>

        <hr class="my-4" />
        <p class="text-center mb-0">
          ¿Ya tienes cuenta? <a href="index.html" class="text-decoration-none">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="domus-footer-credit">Sebas Dev © 2026</footer>

  <script type="module">
    import { registrar } from './js/auth.js';
    import { mostrarMensaje, limpiarMensaje, traducirErrorAuth, alternarCargando } from './js/ui.js';

    document.getElementById('form-registro').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      alternarCargando('btn-registro', true);
      try {
        const { session } = await registrar(email, password, nombre);
        if (session) {
          // Confirmación de correo desactivada en el proyecto: entra directo
          window.location.href = 'hogares.html';
        } else {
          mostrarMensaje(
            'mensaje',
            'Cuenta creada. Revisa tu correo para confirmar antes de iniciar sesión.',
            'success'
          );
          alternarCargando('btn-registro', false, 'Crear cuenta');
        }
      } catch (error) {
        mostrarMensaje('mensaje', traducirErrorAuth(error));
        alternarCargando('btn-registro', false, 'Crear cuenta');
      }
    });
  </script>
</body>
</html>
