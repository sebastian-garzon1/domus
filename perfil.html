<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Mi perfil</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script type="module" src="js/register-sw.js"></script>
</head>
<body>
  <div class="domus-app-shell">
    <aside class="domus-sidebar d-none d-md-flex flex-column">
      <a href="dashboard.html" class="domus-sidebar-brand">🏠 Domus</a>
      <nav class="domus-sidebar-nav flex-grow-1">
        <a href="dashboard.html" class="domus-sidebar-link">🏠 Inicio</a>
        <a href="mercado.html" class="domus-sidebar-link">🛒 Mercado</a>
        <a href="gastos.html" class="domus-sidebar-link">💰 Gastos</a>
        <a href="miembros.html" class="domus-sidebar-link">👥 Miembros</a>
        <a href="hogares.html" class="domus-sidebar-link">🔁 Cambiar de hogar</a>
        <a href="perfil.html" class="domus-sidebar-link active">⚙️ Mi perfil</a>
      </nav>
      <button id="btn-salir" class="btn btn-outline-secondary btn-sm w-100">Cerrar sesión</button>
    </aside>

    <div class="domus-content-col">
      <div class="domus-topbar-mobile d-flex d-md-none align-items-center justify-content-between">
        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">☰</button>
        <span class="domus-sidebar-brand mb-0">🏠 Domus</span>
        <span style="width: 38px"></span>
      </div>

      <main class="domus-main flex-grow-1" style="max-width: 480px;">
    <h2 class="mb-4">Mi perfil</h2>

    <div id="mensaje"></div>

    <form id="form-perfil">
      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" id="email" class="form-control" disabled />
      </div>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" id="nombre" class="form-control" required />
      </div>
      <button type="submit" id="btn-guardar" class="btn btn-domus-primary">Guardar cambios</button>
    </form>
      </main>
    </div>

    <div class="offcanvas offcanvas-start domus-sidebar-offcanvas d-md-none" tabindex="-1" id="sidebarOffcanvas">
      <div class="offcanvas-header">
        <span class="domus-sidebar-brand mb-0">🏠 Domus</span>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <nav class="domus-sidebar-nav flex-grow-1">
          <a href="dashboard.html" class="domus-sidebar-link">🏠 Inicio</a>
          <a href="mercado.html" class="domus-sidebar-link">🛒 Mercado</a>
          <a href="gastos.html" class="domus-sidebar-link">💰 Gastos</a>
          <a href="miembros.html" class="domus-sidebar-link">👥 Miembros</a>
          <a href="hogares.html" class="domus-sidebar-link">🔁 Cambiar de hogar</a>
          <a href="perfil.html" class="domus-sidebar-link active">⚙️ Mi perfil</a>
        </nav>
        <button id="btn-salir-movil" class="btn btn-outline-secondary btn-sm w-100">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { protegerPagina, obtenerUsuarioActual, cerrarSesion } from './js/auth.js';
    import { supabase } from './js/supabaseClient.js';
    import { mostrarMensaje, limpiarMensaje, alternarCargando } from './js/ui.js';

    async function salir() {
      await cerrarSesion();
      window.location.href = 'index.html';
    }
    document.getElementById('btn-salir').addEventListener('click', salir);
    document.getElementById('btn-salir-movil').addEventListener('click', salir);

    const sesion = await protegerPagina();
    let usuario = null;

    if (sesion) {
      usuario = await obtenerUsuarioActual();
      const { data: perfil, error } = await supabase
        .from('profiles')
        .select('nombre_completo, email')
        .eq('id', usuario.id)
        .single();

      if (!error && perfil) {
        document.getElementById('email').value = perfil.email;
        document.getElementById('nombre').value = perfil.nombre_completo ?? '';
      }
    }

    document.getElementById('form-perfil').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const nombre = document.getElementById('nombre').value.trim();

      alternarCargando('btn-guardar', true);
      try {
        const { error } = await supabase
          .from('profiles')
          .update({ nombre_completo: nombre })
          .eq('id', usuario.id);
        if (error) throw error;
        mostrarMensaje('mensaje', 'Perfil actualizado.', 'success');
      } catch (error) {
        mostrarMensaje('mensaje', 'No se pudo guardar: ' + error.message);
      } finally {
        alternarCargando('btn-guardar', false, 'Guardar cambios');
      }
    });
  </script>
</body>
</html>
