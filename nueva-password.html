<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Domus — Nueva contraseña</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script type="module" src="js/register-sw.js"></script>
</head>
<body>
  <div class="domus-auth-shell">
    <div class="card domus-auth-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="domus-logo h2 mb-1">Domus</h1>
          <p class="text-muted mb-0">Define tu nueva contraseña</p>
        </div>

        <div id="mensaje"></div>

        <form id="form-nueva-password" novalidate>
          <div class="mb-3">
            <label for="password" class="form-label">Nueva contraseña</label>
            <input type="password" class="form-control" id="password" required minlength="6" autocomplete="new-password" />
          </div>
          <button type="submit" id="btn-guardar" class="btn btn-domus-primary w-100">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="domus-footer-credit">Sebas Dev © 2026</footer>

  <script type="module">
    import { actualizarPassword } from './js/auth.js';
    import { mostrarMensaje, limpiarMensaje, traducirErrorAuth, alternarCargando } from './js/ui.js';

    // Supabase deja la sesión temporal activa automáticamente al llegar desde
    // el enlace del correo (gracias a detectSessionInUrl: true en el cliente).
    document.getElementById('form-nueva-password').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      limpiarMensaje('mensaje');
      const password = document.getElementById('password').value;

      alternarCargando('btn-guardar', true);
      try {
        await actualizarPassword(password);
        mostrarMensaje('mensaje', 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
        setTimeout(() => (window.location.href = 'index.html'), 1500);
      } catch (error) {
        mostrarMensaje('mensaje', traducirErrorAuth(error));
        alternarCargando('btn-guardar', false, 'Guardar contraseña');
      }
    });
  </script>
</body>
</html>
